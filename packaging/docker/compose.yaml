name: aster-bridge

services:
  aster-bridge:
    image: ghcr.io/aster-privacy/aster-bridge:latest
    container_name: aster-bridge
    restart: unless-stopped
    environment:
      ASTER_BRIDGE_HOSTNAMES: ${ASTER_BRIDGE_HOSTNAMES:-}
      ASTER_BRIDGE_ALLOW_FROM: ${ASTER_BRIDGE_ALLOW_FROM:-}
    secrets:
      - aster_bridge_secret_key
    volumes:
      - aster-bridge-data:/data
    ports:
      - "1143:1143"
      - "1993:1993"
      - "1025:1025"
      - "1465:1465"
      - "1110:1110"
      - "1995:1995"
      - "1080:1080"
      - "1081:1081"

secrets:
  aster_bridge_secret_key:
    file: ./secret-key

volumes:
  aster-bridge-data:
