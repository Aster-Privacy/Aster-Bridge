services:
  aster-bridge:
    image: ghcr.io/aster-privacy/aster-bridge:latest
    init: true
    environment:
      PUID: "1000"
      PGID: "1000"
      ASTER_BRIDGE_SIGN_IN_ON_START: "1"
      ASTER_BRIDGE_HOSTNAMES: bridge.home.arpa
      ASTER_BRIDGE_ALLOW_FROM: 192.168.0.0/16
    volumes:
      - /srv/aster-bridge/data:/data
      - /srv/aster-bridge/secrets:/run/secrets
    ports:
      - target: 1993
        published: 1993
        mode: host
      - target: 1465
        published: 1465
        mode: host
      - target: 1995
        published: 1995
        mode: host
      - target: 1080
        published: 1080
        mode: host
      - target: 1081
        published: 1081
        mode: host
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
