name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: linux
            os: ubuntu-22.04
          - leg: win
            os: windows-latest
          - leg: mac
            os: macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.92.0"
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri -> target

      - name: Setup MSVC environment (Windows, for vendored OpenSSL build)
        if: matrix.leg == 'win'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install NASM (Windows, for vendored OpenSSL / SQLCipher)
        if: matrix.leg == 'win'
        shell: bash
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> "$GITHUB_PATH"

      - name: Install Linux system dependencies
        if: matrix.leg == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            build-essential \
            file \
            perl \
            xdg-utils

      - name: Build @aster/ui
        run: |
          git clone --depth=1 https://github.com/Aster-Privacy/aster-ui.git ../aster-ui
          cd ../aster-ui
          npm ci --no-audit --no-fund
          npm run build

      - name: Fetch aster-crypto source (Aster-Mail)
        run: git clone --depth=1 https://github.com/Aster-Privacy/Aster-Mail.git ../Aster-Mail

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Run clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets
