name: Release

on:
  workflow_dispatch:
    inputs:
      cli_only:
        description: 'Attach only the command-line archives to the current version tag'
        type: boolean
        default: false
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

env:
  SIGNER_VERSION: 2.11.2
  SIGNER_CLI_INTEGRITY: sha512-bk3HemqvGRoy+5D/dVMUQHKMYLglD0jVnMm/0iGMH6ufZ+p8r14m6BpIixwij3PBvZdvORUp1YifTD8QxVZ1Nw==
  SIGNER_NATIVE_INTEGRITY: sha512-Ru4gwJKPG0ctVGchRGpRup4Y4lW2SSfFnrbQcyHhCliKy4g8Qz97TrUgCur4CbWyAgKxvGh3SjrkA0LDYzDGiw==

jobs:
  build:
    if: ${{ !inputs.cli_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: win
            os: windows-latest
            args: ''
          - leg: linux-x64
            os: ubuntu-22.04
            args: ''
          - leg: linux-arm64
            os: ubuntu-22.04-arm
            args: ''
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.92.0"
          targets: ${{ matrix.leg == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Setup MSVC environment (Windows, for vendored OpenSSL build)
        if: matrix.leg == 'win'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install NASM (Windows, for vendored OpenSSL / SQLCipher)
        if: matrix.leg == 'win'
        shell: bash
        run: |
          choco install nasm -y
          echo "C:\\Program Files\\NASM" >> "$GITHUB_PATH"

      - name: Install Linux system dependencies
        if: startsWith(matrix.leg, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            build-essential \
            file \
            perl \
            xdg-utils

      - name: Build @aster/ui
        shell: bash
        run: |
          bash scripts/fetch_pinned_sources.sh ui
          cd ../aster-ui
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Fetch aster-crypto source (Aster-Mail)
        shell: bash
        run: bash scripts/fetch_pinned_sources.sh mail

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Import Apple certificate
        if: matrix.leg == 'mac' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm cert.p12

          if [ -n "$APPLE_SIGNING_IDENTITY_SECRET" ]; then
            SIGNING_IDENTITY="$APPLE_SIGNING_IDENTITY_SECRET"
          else
            SIGNING_IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep '"' | head -1 | sed 's/.*"\(.*\)"/\1/')
          fi
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> $GITHUB_ENV

      - name: Write Apple API key
        if: matrix.leg == 'mac' && env.APPLE_API_KEY_CONTENT != ''
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY_CONTENT" | base64 --decode > ~/private_keys/AuthKey_${APPLE_API_KEY}.p8

      - name: Create a throwaway updater key for the bundler
        shell: bash
        run: npm run tauri -- signer generate --ci -w "$RUNNER_TEMP/throwaway_updater.key"

      - name: Build the app
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY != '' && format('~/private_keys/AuthKey_{0}.p8', secrets.APPLE_API_KEY) || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARGS: ${{ matrix.args }}
          LEG: ${{ matrix.leg }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$LEG" = "win" ]; then
            source scripts/use_msvc_toolchain.sh
          fi
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/throwaway_updater.key")"
          export TAURI_SIGNING_PRIVATE_KEY
          npm run tauri build -- $ARGS

      - name: Unbundle host graphics libraries from the AppImage
        # linuxdeploy copies libwayland-client.so.0 and friends into the AppDir.
        # They shadow the host copies, Mesa's libEGL_mesa.so.0 then fails to
        # resolve wl_fixes_interface on any distribution newer than the runner,
        # and WebKitGTK aborts with EGL_BAD_PARAMETER before the window paints.
        if: startsWith(matrix.leg, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y squashfs-tools
          shopt -s nullglob
          for img in src-tauri/target/release/bundle/appimage/*.AppImage; do
            bash scripts/fix_appimage_libs.sh "$img"
          done

      - name: Build the Arch Linux package
        # Arch has no .deb or .rpm, and the AppImage is not a package. Repack the
        # deb built above into a pacman package inside an Arch container so
        # `pacman -U` installs Aster Bridge like any other Arch package.
        if: matrix.leg == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          shopt -s nullglob
          DEBS=(src-tauri/target/release/bundle/deb/*_"${V}"_amd64.deb)
          if [ ${#DEBS[@]} -ne 1 ]; then
            echo "::error::expected one amd64 deb for $V, found ${#DEBS[@]}"
            exit 1
          fi
          cp "${DEBS[0]}" "packaging/arch/aster-bridge-${V}-amd64.deb"
          docker run --rm -e V="$V" -v "$PWD/packaging/arch:/pkg" archlinux:base-devel bash -c '
            set -euo pipefail
            pacman -Sy --noconfirm --needed pacman-contrib >/dev/null
            useradd -m builder
            cp /pkg/PKGBUILD /home/builder/PKGBUILD
            cp "/pkg/aster-bridge-${V}-amd64.deb" /home/builder/
            chown -R builder:builder /home/builder
            su builder -c "cd /home/builder && sed -i \"s/^pkgver=.*/pkgver=$V/\" PKGBUILD && updpkgsums && makepkg -f --noconfirm --nodeps"
            cp /home/builder/*.pkg.tar.zst /pkg/
          '
          PKG="packaging/arch/aster-bridge-${V}-1-x86_64.pkg.tar.zst"
          test -f "$PKG"
          cp "$PKG" "packaging/arch/Aster-Bridge-x86_64.pkg.tar.zst"

      - name: Collect the unsigned bundles
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/bundle"
          mkdir -p "$OUT"
          shopt -s nullglob
          for b in src-tauri/target/release/bundle src-tauri/target/*/release/bundle; do
            for f in "$b"/nsis/*-setup.exe "$b"/msi/*.msi "$b"/appimage/*.AppImage "$b"/deb/*.deb "$b"/rpm/*.rpm "$b"/dmg/*.dmg "$b"/macos/*.app.tar.gz; do
              cp "$f" "$OUT/"
            done
          done
          if [ "${{ matrix.leg }}" = "linux-x64" ]; then
            cp packaging/arch/*.pkg.tar.zst "$OUT/"
          fi
          ls -l "$OUT"

      - name: Upload the unsigned bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-${{ matrix.leg }}
          path: ${{ runner.temp }}/bundle/
          if-no-files-found: error
          retention-days: 1

      - name: Stage the installers built in this run for provenance
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/provenance"
          B="src-tauri/target/release/bundle"
          mkdir -p "$OUT"
          shopt -s nullglob
          stage() {
            local dst="$1"
            shift
            for f in "$@"; do
              if [ -f "$f" ]; then
                cp "$f" "$OUT/$dst"
                return 0
              fi
            done
            echo "::warning::$dst was not built in this run, so it gets no provenance attestation"
          }
          case "${{ matrix.leg }}" in
            win)
              stage Aster-Bridge-x64-setup.exe "$B"/nsis/*-setup.exe
              stage Aster-Bridge-x64.msi "$B"/msi/*.msi
              ;;
            linux-x64)
              stage Aster-Bridge-x86_64.AppImage "$B"/appimage/*.AppImage
              stage Aster-Bridge-amd64.deb "$B"/deb/*.deb
              stage Aster-Bridge-x86_64.rpm "$B"/rpm/*.rpm
              stage Aster-Bridge-x86_64.pkg.tar.zst packaging/arch/Aster-Bridge-x86_64.pkg.tar.zst
              ;;
            linux-arm64)
              stage Aster-Bridge-aarch64.AppImage "$B"/appimage/*.AppImage
              stage Aster-Bridge-arm64.deb "$B"/deb/*.deb
              stage Aster-Bridge-aarch64.rpm "$B"/rpm/*.rpm
              ;;
          esac
          ls -l "$OUT"

      - name: Upload this run's installers for provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-${{ matrix.leg }}
          path: ${{ runner.temp }}/provenance/
          if-no-files-found: warn
          retention-days: 1

  cli:
    needs: build
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: universal-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.92.0"
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Setup MSVC environment (Windows, for vendored OpenSSL build)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install NASM (Windows, for vendored OpenSSL / SQLCipher)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          choco install nasm -y
          echo "C:\\Program Files\\NASM" >> "$GITHUB_PATH"

      - name: Fetch aster-crypto source (Aster-Mail)
        shell: bash
        run: bash scripts/fetch_pinned_sources.sh mail

      - name: Build and package the command-line tool
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri
          if [ "$TARGET" = "x86_64-pc-windows-msvc" ]; then
            source ../scripts/use_msvc_toolchain.sh
          fi
          case "$TARGET" in
            universal-apple-darwin)
              cargo build --release --locked -p aster-bridge-cli --target aarch64-apple-darwin
              cargo build --release --locked -p aster-bridge-cli --target x86_64-apple-darwin
              mkdir -p target/universal
              lipo -create -output target/universal/aster-bridge \
                target/aarch64-apple-darwin/release/aster-bridge \
                target/x86_64-apple-darwin/release/aster-bridge
              codesign --force --sign - target/universal/aster-bridge
              BIN="target/universal/aster-bridge"
              ;;
            x86_64-pc-windows-msvc)
              cargo build --release --locked -p aster-bridge-cli
              BIN="target/release/aster-bridge.exe"
              ;;
            *)
              cargo build --release --locked -p aster-bridge-cli
              BIN="target/release/aster-bridge"
              if ldd "$BIN" | grep -Ei 'webkit|gtk|dbus|ssl'; then
                echo "::error::aster-bridge links a shared library it must not need"
                exit 1
              fi
              ;;
          esac
          "$BIN" version

          NAME="aster-bridge-cli-${TARGET}"
          STAGE="$RUNNER_TEMP/$NAME"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp "$BIN" ../LICENSE "$STAGE/"
          cd "$RUNNER_TEMP"
          if [ "$TARGET" = "x86_64-pc-windows-msvc" ]; then
            ARCHIVE="$NAME.zip"
            7z a -tzip "$ARCHIVE" "$NAME" >/dev/null
          else
            ARCHIVE="$NAME.tar.gz"
            tar -czf "$ARCHIVE" "$NAME"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
          cat "$ARCHIVE.sha256"
          mkdir -p "$RUNNER_TEMP/cli" "$RUNNER_TEMP/provenance"
          cp "$ARCHIVE" "$ARCHIVE.sha256" "$RUNNER_TEMP/cli/"
          cp "$ARCHIVE" "$RUNNER_TEMP/provenance/"

      - name: Upload the command-line archive for publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: ${{ runner.temp }}/cli/
          if-no-files-found: error
          retention-days: 1

      - name: Upload this run's command-line archive for provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-cli-${{ matrix.target }}
          path: ${{ runner.temp }}/provenance/
          if-no-files-found: ignore
          retention-days: 1

  sign:
    needs: build
    if: ${{ always() && !inputs.cli_only }}
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
      - name: Download the unsigned bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundle-*
          path: bundles

      - name: Install the pinned updater signer
        shell: bash
        run: |
          set -euo pipefail
          SIGNER="$RUNNER_TEMP/signer/node_modules/@tauri-apps"
          fetch() {
            local pkg="$1" integrity="$2"
            local tgz="$RUNNER_TEMP/$pkg.tgz"
            curl -fsSL --retry 3 -o "$tgz" "https://registry.npmjs.org/@tauri-apps/$pkg/-/$pkg-${SIGNER_VERSION}.tgz"
            local got="sha512-$(openssl dgst -sha512 -binary "$tgz" | base64 -w0)"
            if [ "$got" != "$integrity" ]; then
              echo "::error::@tauri-apps/$pkg $SIGNER_VERSION does not match the pinned integrity"
              exit 1
            fi
            mkdir -p "$SIGNER/$pkg"
            tar -xzf "$tgz" -C "$SIGNER/$pkg" --strip-components=1
          }
          fetch cli "$SIGNER_CLI_INTEGRITY"
          fetch cli-linux-x64-gnu "$SIGNER_NATIVE_INTEGRITY"

      - name: Sign every updater bundle with the current and the next updater key
        env:
          UPDATER_KEY_V1: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_KEY_V1_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_KEY_V2: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_V2 }}
          UPDATER_KEY_V2_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD_V2 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$UPDATER_KEY_V1" ] || [ -z "$UPDATER_KEY_V2" ]; then
            echo "::error::both updater keys must be set; installs on either key would stop updating"
            exit 1
          fi
          BUNDLES="$PWD/bundles"
          SIGS="$RUNNER_TEMP/signatures"
          TAURI="$RUNNER_TEMP/signer/node_modules/@tauri-apps/cli/tauri.js"
          WORK="$(mktemp -d)"
          cd "$WORK"
          sign_with() {
            local key="$1" password="$2" file="$3" dest="$4"
            rm -f "$file.sig"
            TAURI_SIGNING_PRIVATE_KEY="$key" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$password" node "$TAURI" signer sign "$file" </dev/null
            mv "$file.sig" "$dest"
          }
          COUNT=0
          while IFS= read -r -d '' f; do
            rel="${f#"$BUNDLES"/}"
            mkdir -p "$SIGS/$(dirname "$rel")"
            sign_with "$UPDATER_KEY_V1" "$UPDATER_KEY_V1_PASSWORD" "$f" "$SIGS/$rel.sig"
            sign_with "$UPDATER_KEY_V2" "$UPDATER_KEY_V2_PASSWORD" "$f" "$SIGS/$rel.v2.sig"
            COUNT=$((COUNT + 1))
          done < <(find "$BUNDLES" -mindepth 2 -maxdepth 2 -type f \( -name '*-setup.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.app.tar.gz' \) -print0)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::no updater bundles to sign; every build leg failed"
            exit 1
          fi
          find "$SIGS" -type f -name '*.sig' | sort

      - name: Upload the updater signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: updater-signatures
          path: ${{ runner.temp }}/signatures/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [build, sign]
    if: ${{ always() && !inputs.cli_only && needs.sign.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - name: Download the unsigned bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundle-*
          path: bundles

      - name: Download the updater signatures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: updater-signatures
          path: bundles

      - name: Publish the installers and their fixed-name copies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          TAG="v${V}"
          OUT="$RUNNER_TEMP/upload"
          mkdir -p "$OUT"
          shopt -s nullglob

          for f in bundles/*/*; do
            name="$(basename "$f")"
            case "$name" in
              *.app.tar.gz) name="Aster Bridge_${V}_universal.app.tar.gz" ;;
              *.app.tar.gz.sig) name="Aster Bridge_${V}_universal.app.tar.gz.sig" ;;
              *.app.tar.gz.v2.sig) name="Aster Bridge_${V}_universal.app.tar.gz.v2.sig" ;;
            esac
            cp "$f" "$OUT/${name// /.}"
          done

          declare -A FIXED=(
            ["Aster.Bridge_${V}_x64-setup.exe"]="Aster-Bridge-x64-setup.exe"
            ["Aster.Bridge_${V}_x64_en-US.msi"]="Aster-Bridge-x64.msi"
            ["Aster.Bridge_${V}_amd64.AppImage"]="Aster-Bridge-x86_64.AppImage"
            ["Aster.Bridge_${V}_amd64.deb"]="Aster-Bridge-amd64.deb"
            ["Aster.Bridge-${V}-1.x86_64.rpm"]="Aster-Bridge-x86_64.rpm"
            ["Aster.Bridge_${V}_aarch64.AppImage"]="Aster-Bridge-aarch64.AppImage"
            ["Aster.Bridge_${V}_arm64.deb"]="Aster-Bridge-arm64.deb"
            ["Aster.Bridge-${V}-1.aarch64.rpm"]="Aster-Bridge-aarch64.rpm"
            ["Aster.Bridge_${V}_universal.dmg"]="Aster-Bridge-universal.dmg"
            ["Aster.Bridge_${V}_universal.app.tar.gz"]="Aster-Bridge-universal.app.tar.gz"
          )
          for src in "${!FIXED[@]}"; do
            for ext in "" ".sig" ".v2.sig"; do
              if [ -f "$OUT/$src$ext" ]; then
                cp "$OUT/$src$ext" "$OUT/${FIXED[$src]}$ext"
              fi
            done
          done
          ls -l "$OUT"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Aster Bridge ${V}" --notes "" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" "$OUT"/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Rebuild latest.json and latest_v2.json from every leg's signatures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          TAG="v${V}"
          TMP=$(mktemp -d)
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::no release $TAG to build a manifest for; the build legs did not publish"
            exit 1
          fi

          for manifest in latest.json latest_v2.json; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$manifest" --dir "$TMP" --clobber 2>/dev/null || echo '{}' > "$TMP/$manifest"
          done
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir "$TMP" --clobber || true

          build_manifest() {
            SIGDIR="$TMP" SIGEXT="$2" BASE="$BASE" V="$V" node -e '
            const fs = require("fs");
            const path = process.argv[1];
            const dir = process.env.SIGDIR;
            const base = process.env.BASE;
            const v = process.env.V;
            const ext = process.env.SIGEXT;
            const label = path.split("/").pop();
            const prior = JSON.parse(fs.readFileSync(path, "utf8"));

            const legs = {
              "windows-x86_64":         ["Aster-Bridge-x64-setup.exe", `Aster.Bridge_${v}_x64-setup.exe`],
              "windows-x86_64-nsis":    ["Aster-Bridge-x64-setup.exe", `Aster.Bridge_${v}_x64-setup.exe`],
              "windows-x86_64-msi":     [`Aster.Bridge_${v}_x64_en-US.msi`],
              "linux-x86_64":           ["Aster-Bridge-x86_64.AppImage", `Aster.Bridge_${v}_amd64.AppImage`],
              "linux-x86_64-appimage":  ["Aster-Bridge-x86_64.AppImage", `Aster.Bridge_${v}_amd64.AppImage`],
              "linux-x86_64-deb":       [`Aster.Bridge_${v}_amd64.deb`],
              "linux-x86_64-rpm":       [`Aster.Bridge-${v}-1.x86_64.rpm`],
              "linux-aarch64":          ["Aster-Bridge-aarch64.AppImage", `Aster.Bridge_${v}_aarch64.AppImage`],
              "linux-aarch64-appimage": ["Aster-Bridge-aarch64.AppImage", `Aster.Bridge_${v}_aarch64.AppImage`],
              "linux-aarch64-deb":      [`Aster.Bridge_${v}_arm64.deb`],
              "linux-aarch64-rpm":      [`Aster.Bridge-${v}-1.aarch64.rpm`],
              "darwin-aarch64":         ["Aster-Bridge-universal.app.tar.gz", `Aster.Bridge_${v}_universal.app.tar.gz`],
              "darwin-x86_64":          ["Aster-Bridge-universal.app.tar.gz", `Aster.Bridge_${v}_universal.app.tar.gz`],
            };

            const manifest = {
              version: prior.version || v,
              notes: prior.notes || "",
              pub_date: new Date().toISOString(),
              platforms: {},
            };

            for (const [key, candidates] of Object.entries(legs)) {
              const hit = candidates.find((f) => fs.existsSync(`${dir}/${f}${ext}`));
              if (!hit) {
                console.log(`::warning::${label} has no signature for ${key} on this release; installs on that platform will not self-update`);
                continue;
              }
              manifest.platforms[key] = {
                signature: fs.readFileSync(`${dir}/${hit}${ext}`, "utf8").trim(),
                url: `${base}/${hit}`,
              };
            }

            const platforms = Object.keys(manifest.platforms);
            console.log(`${label} platforms:`, platforms.join(", "));

            const required = ["windows-x86_64", "linux-x86_64"];
            const missing = required.filter((k) => !platforms.includes(k));
            if (missing.length) {
              console.log(`::error::${label} is missing ${missing.join(", ")} - those installs would never self-update`);
              process.exit(1);
            }
            if (!platforms.includes("linux-aarch64")) {
              console.log(`::warning::${label} is missing linux-aarch64; ARM installs will not self-update`);
            }
            if (!platforms.includes("darwin-aarch64")) {
              console.log("::warning::no macOS build on this release; Mac installs stay on their current version");
            }

            fs.writeFileSync(path, JSON.stringify(manifest, null, 2));
          ' "$1"
          }

          build_manifest "$TMP/latest.json" .sig
          build_manifest "$TMP/latest_v2.json" .v2.sig
          gh release upload "$TAG" "$TMP/latest.json" "$TMP/latest_v2.json" --repo "$GITHUB_REPOSITORY" --clobber

  publish_cli:
    needs: [cli, publish]
    if: ${{ always() && needs.cli.result != 'skipped' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - name: Download the command-line archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          path: cli
          merge-multiple: true

      - name: Publish the command-line archives
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          TAG="v${V}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning::no release $TAG to attach the command-line archives to"
            exit 0
          fi
          shopt -s nullglob
          FILES=(cli/aster-bridge-cli-*)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::warning::no command-line archive was built in this run"
            exit 0
          fi
          gh release upload "$TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  ensure_download_assets:
    needs: [build, publish, publish_cli]
    if: always() && needs.build.result == 'success' && needs.publish.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Ensure fixed-name bridge download assets exist
        # release.yml builds Windows + Linux only; the verify_release_assets.yml guard
        # cannot fire on a release created by GITHUB_TOKEN, so carry the macOS dmg over
        # from a prior release here, in-run, to stop /api/bridge/v1/download/macos-dmg 404ing.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          V=$(node -p "require('./package.json').version" 2>/dev/null || echo "")
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME#v}"; fi
          TAG="v${V}"
          TMP="$(mktemp -d)"
          CARRIED=()

          REQUIRED=(
            Aster-Bridge-x64-setup.exe
            Aster-Bridge-x64.msi
            Aster-Bridge-x86_64.AppImage
            Aster-Bridge-amd64.deb
            Aster-Bridge-x86_64.rpm
            Aster-Bridge-universal.dmg
          )

          OPTIONAL=(
            Aster-Bridge-aarch64.AppImage
            Aster-Bridge-arm64.deb
            Aster-Bridge-aarch64.rpm
            Aster-Bridge-x86_64.pkg.tar.zst
            aster-bridge-cli-x86_64-unknown-linux-gnu.tar.gz
            aster-bridge-cli-x86_64-unknown-linux-gnu.tar.gz.sha256
            aster-bridge-cli-aarch64-unknown-linux-gnu.tar.gz
            aster-bridge-cli-aarch64-unknown-linux-gnu.tar.gz.sha256
            aster-bridge-cli-universal-apple-darwin.tar.gz
            aster-bridge-cli-universal-apple-darwin.tar.gz.sha256
            aster-bridge-cli-x86_64-pc-windows-msvc.zip
            aster-bridge-cli-x86_64-pc-windows-msvc.zip.sha256
          )

          declare -A SRC=(
            [Aster-Bridge-x64-setup.exe]="Aster.Bridge_${V}_x64-setup.exe"
            [Aster-Bridge-x64.msi]="Aster.Bridge_${V}_x64_en-US.msi"
            [Aster-Bridge-x86_64.AppImage]="Aster.Bridge_${V}_amd64.AppImage"
            [Aster-Bridge-amd64.deb]="Aster.Bridge_${V}_amd64.deb"
            [Aster-Bridge-x86_64.rpm]="Aster.Bridge-${V}-1.x86_64.rpm"
            [Aster-Bridge-aarch64.AppImage]="Aster.Bridge_${V}_aarch64.AppImage"
            [Aster-Bridge-arm64.deb]="Aster.Bridge_${V}_arm64.deb"
            [Aster-Bridge-aarch64.rpm]="Aster.Bridge-${V}-1.aarch64.rpm"
            [Aster-Bridge-universal.dmg]="Aster.Bridge_${V}_universal.dmg"
            [Aster-Bridge-x86_64.pkg.tar.zst]="aster-bridge-${V}-1-x86_64.pkg.tar.zst"
          )

          assets() { gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name'; }
          has() { assets | grep -qxF "$1"; }

          for name in "${REQUIRED[@]}" "${OPTIONAL[@]}"; do
            if has "$name"; then echo "ok: $name"; continue; fi

            src="${SRC[$name]:-}"
            if [ -n "$src" ] && has "$src"; then
              echo "::notice::self-healing $name from $src on $TAG"
              gh release download "$TAG" --repo "$REPO" --pattern "$src" --dir "$TMP" --clobber
              mv "$TMP/$src" "$TMP/$name"
              gh release upload "$TAG" "$TMP/$name" --repo "$REPO" --clobber
              continue
            fi

            case "$name" in
              Aster-Bridge-universal.dmg|aster-bridge-cli-*)
                echo "::warning::$name is missing on $TAG; carrying it over from the most recent release that has it"
                for prev in $(gh release list --repo "$REPO" --limit 40 --json tagName,isDraft -q '.[] | select(.isDraft==false) | .tagName'); do
                  [ "$prev" = "$TAG" ] && continue
                  if gh release view "$prev" --repo "$REPO" --json assets -q '.assets[].name' | grep -qxF "$name"; then
                    gh release download "$prev" --repo "$REPO" --pattern "$name" --dir "$TMP" --clobber
                    gh release upload "$TAG" "$TMP/$name" --repo "$REPO" --clobber
                    echo "::warning::carried over $name from $prev - cut a fresh build to replace it"
                    CARRIED+=("\`$name\` ($prev)")
                    break
                  fi
                done
                ;;
            esac
          done

          ABSENT_OPTIONAL=()
          for name in "${OPTIONAL[@]}"; do
            has "$name" || ABSENT_OPTIONAL+=("$name")
          done
          if [ ${#ABSENT_OPTIONAL[@]} -ne 0 ]; then
            echo "::warning::$TAG is missing optional assets: ${ABSENT_OPTIONAL[*]}. Those download links fall back to an older release."
          fi

          MISSING=()
          for name in "${REQUIRED[@]}"; do
            has "$name" || MISSING+=("$name")
          done

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "::error::Release $TAG is missing bridge download assets: ${MISSING[*]}"
            echo "The in-app Bridge downloads (/api/bridge/v1/download/<platform>) for these will 404. See the parent CLAUDE.md 'Website Download Assets'."
            exit 1
          fi

          if [ ${#CARRIED[@]} -ne 0 ]; then
            LIST="$(printf '%s, ' "${CARRIED[@]}")"
            LIST="${LIST%, }"
            MARK="has no new build of the following files"
            NOTE="$(printf '> [!WARNING]\n> This release %s. Each one is a copy from the release shown in parentheses: %s.' "$MARK" "$LIST")"
            {
              echo "### Files not built in this run"
              echo ""
              echo "$TAG $MARK. Each one is a copy from the release shown in parentheses, and none of them has a provenance attestation for this run: $LIST."
            } >> "$GITHUB_STEP_SUMMARY"
            BODY="$(gh release view "$TAG" --repo "$REPO" --json body -q .body)"
            if ! grep -qF "$MARK" <<<"$BODY"; then
              printf '%s\n\n%s\n' "$BODY" "$NOTE" > "$TMP/body.md"
              gh release edit "$TAG" --repo "$REPO" --notes-file "$TMP/body.md"
            fi
          fi

          echo "All 6 bridge download assets present on $TAG."
          gh release edit "$TAG" --repo "$REPO" --prerelease=false --latest
          echo "Promoted $TAG to Latest."

  attest_provenance:
    needs: [build, cli, ensure_download_assets]
    if: always()
    runs-on: ubuntu-22.04
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the installers built in this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: provenance-*
          path: attest
          merge-multiple: true
      - name: List what this run built
        id: built
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p attest
          COUNT=$(find attest -maxdepth 1 -type f | wc -l)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          {
            echo "### Provenance"
            echo ""
            echo "Only files built in this run are attested. A file carried over from an earlier release or uploaded by hand has no attestation for this run."
            echo ""
            for a in Aster-Bridge-x64-setup.exe Aster-Bridge-x64.msi Aster-Bridge-x86_64.AppImage Aster-Bridge-amd64.deb Aster-Bridge-x86_64.rpm Aster-Bridge-universal.dmg aster-bridge-cli-x86_64-unknown-linux-gnu.tar.gz aster-bridge-cli-aarch64-unknown-linux-gnu.tar.gz aster-bridge-cli-universal-apple-darwin.tar.gz aster-bridge-cli-x86_64-pc-windows-msvc.zip; do
              if [ -f "attest/$a" ]; then
                echo "- \`$a\`: built in this run, attested"
              else
                echo "- \`$a\`: not built in this run, not attested"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          ls -l attest || true
      - name: Attest build provenance
        if: steps.built.outputs.count != '0'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "attest/*"
