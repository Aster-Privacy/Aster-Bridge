name: Linux ARM AppImage

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the ARM AppImage to (leave blank to only upload a build artifact)'
        required: false
        default: ''

permissions:
  contents: read

env:
  SIGNER_VERSION: 2.11.2
  SIGNER_CLI_INTEGRITY: sha512-bk3HemqvGRoy+5D/dVMUQHKMYLglD0jVnMm/0iGMH6ufZ+p8r14m6BpIixwij3PBvZdvORUp1YifTD8QxVZ1Nw==
  SIGNER_NATIVE_INTEGRITY: sha512-Ru4gwJKPG0ctVGchRGpRup4Y4lW2SSfFnrbQcyHhCliKy4g8Qz97TrUgCur4CbWyAgKxvGh3SjrkA0LDYzDGiw==

jobs:
  build:
    runs-on: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.92.0"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            build-essential \
            file \
            perl \
            xdg-utils \
            libfuse2 \
            desktop-file-utils

      - name: Build @aster/ui
        shell: bash
        run: |
          bash scripts/fetch_pinned_sources.sh ui
          cd ../aster-ui
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Fetch aster-crypto source (Aster-Mail)
        shell: bash
        run: bash scripts/fetch_pinned_sources.sh mail

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Create a throwaway updater key for the bundler
        shell: bash
        run: npm run tauri -- signer generate --ci -w "$RUNNER_TEMP/throwaway_updater.key"

      - name: Build ARM AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          NO_STRIP: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        shell: bash
        run: |
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/throwaway_updater.key")"
          export TAURI_SIGNING_PRIVATE_KEY
          npm run tauri build -- --bundles appimage --verbose

      - name: Collect the unsigned AppImage
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(mktemp -d)
          SRC=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*aarch64.AppImage' | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::no aarch64 AppImage produced"
            exit 1
          fi
          cp "$SRC" "$OUT/"
          echo "outdir=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      - name: Upload the unsigned AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-linux-arm64-appimage
          path: ${{ steps.collect.outputs.outdir }}
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-22.04
    permissions: {}

    steps:
      - name: Download the unsigned AppImage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-linux-arm64-appimage
          path: unsigned

      - name: Install the pinned updater signer
        shell: bash
        run: |
          set -euo pipefail
          SIGNER="$RUNNER_TEMP/signer/node_modules/@tauri-apps"
          fetch() {
            local pkg="$1" integrity="$2"
            local tgz="$RUNNER_TEMP/$pkg.tgz"
            curl -fsSL --retry 3 -o "$tgz" "https://registry.npmjs.org/@tauri-apps/$pkg/-/$pkg-${SIGNER_VERSION}.tgz"
            local got="sha512-$(openssl dgst -sha512 -binary "$tgz" | base64 -w0)"
            if [ "$got" != "$integrity" ]; then
              echo "::error::@tauri-apps/$pkg $SIGNER_VERSION does not match the pinned integrity"
              exit 1
            fi
            mkdir -p "$SIGNER/$pkg"
            tar -xzf "$tgz" -C "$SIGNER/$pkg" --strip-components=1
          }
          fetch cli "$SIGNER_CLI_INTEGRITY"
          fetch cli-linux-x64-gnu "$SIGNER_NATIVE_INTEGRITY"

      - name: Sign and collect canonical names
        id: collect
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(mktemp -d)
          SRC=$(find "$PWD/unsigned" -maxdepth 1 -type f -name '*aarch64.AppImage' | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::no aarch64 AppImage to sign"
            exit 1
          fi
          WORK="$(mktemp -d)"
          (cd "$WORK" && node "$RUNNER_TEMP/signer/node_modules/@tauri-apps/cli/tauri.js" signer sign "$SRC" </dev/null)
          cp "$SRC" "$OUT/Aster-Bridge-aarch64.AppImage"
          cp "${SRC}.sig" "$OUT/Aster-Bridge-aarch64.AppImage.sig"
          echo "outdir=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aster-bridge-linux-arm64-appimage
          path: ${{ steps.collect.outputs.outdir }}
          if-no-files-found: error

  attach:
    needs: sign
    if: inputs.tag != ''
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download the signed AppImage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aster-bridge-linux-arm64-appimage
          path: signed

      - name: Attach to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            signed/Aster-Bridge-aarch64.AppImage \
            signed/Aster-Bridge-aarch64.AppImage.sig \
            --repo "$GITHUB_REPOSITORY" --clobber
