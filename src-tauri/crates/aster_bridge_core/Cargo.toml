[package]
name = "aster-bridge-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Protocol servers, sync, and storage shared by Aster Bridge and its CLI"

[features]
test-support = []

[dependencies]
aster-crypto = { path = "../../../../Aster-Mail/aster-crypto", default-features = false, features = ["std"] }

tokio = { workspace = true }
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
mail-parser = { workspace = true }
quick-xml = "0.41"

axum = { version = "0.7", features = ["macros", "ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rcgen = "0.13"
rustls = { workspace = true }
rustls-pemfile = "2"
webpki-roots = "1"
x509-parser = "0.16"
subtle = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
time = "0.3"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
async-stream = "0.3"
percent-encoding = "2"

ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
p256 = { version = "0.13", features = ["ecdh"] }
ml-kem = { version = "0.2", features = ["deterministic"] }
miniz_oxide = "0.8"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
hkdf = "0.12"
pbkdf2 = "0.12"
sha2 = "0.10"
hmac = "0.12"
argon2 = "0.5"
rand = "0.8"
rand_core = "0.6"

keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
zeroize = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
whoami = { workspace = true }

tracing = { workspace = true }
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = "0.23"
