[workspace]
members = [".", "crates/aster_bridge_core", "crates/aster_bridge_cli"]
resolver = "2"

[workspace.package]
version = "0.4.33"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
aster-bridge-core = { path = "crates/aster_bridge_core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
zeroize = { version = "1", features = ["derive"] }
mail-parser = "0.9"
whoami = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tempfile = "3"

[package]
name = "aster-bridge-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Aster Bridge - IMAP/SMTP bridge for Aster Mail"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aster-bridge-core = { workspace = true }

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rustls = { workspace = true }
zeroize = { workspace = true }
mail-parser = { workspace = true }
whoami = { workspace = true }
open = "5"

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
